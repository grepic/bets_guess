version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartbets
      POSTGRES_PASSWORD: smartbets
      POSTGRES_DB: smartbets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbets"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SMARTBETS_DATABASE_URL: "postgresql+asyncpg://smartbets:smartbets@postgres:5432/smartbets"
      SMARTBETS_DATABASE_URL_SYNC: "postgresql://smartbets:smartbets@postgres:5432/smartbets"
      SMARTBETS_REDIS_URL: "redis://redis:6379/0"
      SMARTBETS_CELERY_BROKER_URL: "redis://redis:6379/1"
      SMARTBETS_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/src

  celery-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A apps.api.jobs.worker worker --loglevel=info --concurrency=2
    environment:
      SMARTBETS_DATABASE_URL: "postgresql+asyncpg://smartbets:smartbets@postgres:5432/smartbets"
      SMARTBETS_REDIS_URL: "redis://redis:6379/0"
      SMARTBETS_CELERY_BROKER_URL: "redis://redis:6379/1"
      SMARTBETS_CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A apps.api.jobs.worker beat --loglevel=info
    environment:
      SMARTBETS_DATABASE_URL: "postgresql+asyncpg://smartbets:smartbets@postgres:5432/smartbets"
      SMARTBETS_REDIS_URL: "redis://redis:6379/0"
      SMARTBETS_CELERY_BROKER_URL: "redis://redis:6379/1"
      SMARTBETS_CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
